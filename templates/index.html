<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor TED - IPEA</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card-stat { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card-stat:hover { transform: translateY(-5px); }
        .stat-value { font-size: 2rem; font-weight: bold; color: #0d6efd; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 9999; text-align: center; padding-top: 20%; }
    </style>
</head>
<body>

    <!-- Loading Spinner -->
    <div id="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
        <h3 class="mt-3">Atualizando dados do IPEA...</h3>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🏛️ Monitor TED - IPEA</span>
            <button class="btn btn-light btn-sm" onclick="syncData()">
                🔄 Sincronizar Agora
            </button>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <!-- Cards de Estatísticas -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card card-stat p-3 bg-white">
                    <h6 class="text-muted">Total de TEDs</h6>
                    <div class="stat-value" id="total-teds">-</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat p-3 bg-white">
                    <h6 class="text-muted">Valor Total Repassado</h6>
                    <div class="stat-value text-success" id="total-valor">-</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat p-3 bg-white">
                    <h6 class="text-muted">Última Atualização</h6>
                    <div class="stat-value fs-6 text-dark mt-2" id="last-update">-</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-stat p-3 bg-white">
                    <h6 class="text-muted">Status da API</h6>
                    <div class="stat-value fs-6 text-success mt-2">🟢 Online</div>
                </div>
            </div>
        </div>

        <!-- Gráficos -->
        <div class="row g-4 mb-4">
            <div class="col-md-8">
                <div class="card card-stat p-3 bg-white">
                    <h5>📈 Evolução Mensal de Repasses</h5>
                    <div class="chart-container">
                        <canvas id="chartEvolucao"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card card-stat p-3 bg-white">
                    <h5>💰 Top 5 Beneficiários</h5>
                    <div class="chart-container">
                        <canvas id="chartBeneficiarios"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de Dados -->
        <div class="card card-stat p-3 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5>📋 Últimas Transferências</h5>
                <input type="text" id="searchInput" class="form-control w-25" placeholder="Buscar por beneficiário..." onkeyup="filterTable()">
            </div>
            <div class="table-responsive">
                <table class="table table-hover" id="tedTable">
                    <thead class="table-light">
                        <tr>
                            <th>Data</th>
                            <th>Beneficiário</th>
                            <th>Valor (R$)</th>
                            <th>Descrição</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dados inseridos via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let chartEvolucaoInstance = null;
        let chartBeneficiariosInstance = null;

        // Formatar Moeda
        const formatBRL = (value) => {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        };

        // Formatar Data
        const formatDate = (dateString) => {
            if (!dateString) return '-';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR');
        };

        // Carregar Dados
        async function loadData() {
            try {
                const response = await fetch('/api/stats');
                const stats = await response.json();

                // Atualizar Cards
                document.getElementById('total-teds').innerText = stats.total_teds || 0;
                document.getElementById('total-valor').innerText = formatBRL(stats.total_valor || 0);
                document.getElementById('last-update').innerText = stats.last_update ? new Date(stats.last_update).toLocaleString('pt-BR') : 'Nunca';

                // Carregar Tabela
                loadTable(stats.recent_teds);

                // Carregar Gráficos
                renderCharts(stats.chart_data);

            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                alert('Erro ao conectar com a API. Verifique se o backend está rodando.');
            }
        }

        // Carregar Tabela
        function loadTable(teds) {
            const tbody = document.querySelector('#tedTable tbody');
            tbody.innerHTML = '';
            
            if (!teds || teds.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhum dado encontrado. Clique em "Sincronizar Agora".</td></tr>';
                return;
            }

            teds.forEach(ted => {
                const row = `
                    <tr>
                        <td>${formatDate(ted.data_transacao)}</td>
                        <td>${ted.nome_beneficiario || 'Não informado'}</td>
                        <td>${formatBRL(ted.valor_repasse)}</td>
                        <td class="text-truncate" style="max-width: 300px;" title="${ted.descricao}">${ted.descricao || '-'}</td>
                        <td><span class="badge bg-success">${ted.status || 'Concluído'}</span></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Filtrar Tabela
        function filterTable() {
            const input = document.getElementById("searchInput");
            const filter = input.value.toUpperCase();
            const table = document.getElementById("tedTable");
            const tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                const td = tr[i].getElementsByTagName("td")[1]; // Coluna Beneficiário
                if (td) {
                    const txtValue = td.textContent || td.innerText;
                    tr[i].style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }

        // Renderizar Gráficos
        function renderCharts(data) {
            // Gráfico de Evolução (Linha)
            const ctxEvolucao = document.getElementById('chartEvolucao').getContext('2d');
            if (chartEvolucaoInstance) chartEvolucaoInstance.destroy();
            
            chartEvolucaoInstance = new Chart(ctxEvolucao, {
                type: 'line',
                data: {
                    labels: data.meses || [],
                    datasets: [{
                        label: 'Valor Repassado (R$)',
                        data: data.valores_mes || [],
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Gráfico de Beneficiários (Barra Horizontal)
            const ctxBen = document.getElementById('chartBeneficiarios').getContext('2d');
            if (chartBeneficiariosInstance) chartBeneficiariosInstance.destroy();

            chartBeneficiariosInstance = new Chart(ctxBen, {
                type: 'bar',
                data: {
                    labels: data.top_beneficiarios_labels || [],
                    datasets: [{
                        label: 'Total Recebido',
                        data: data.top_beneficiarios_values || [],
                        backgroundColor: '#198754',
                        borderRadius: 5
                    }]
                },
                options: { 
                    indexAxis: 'y',
                    responsive: true, 
                    maintainAspectRatio: false 
                }
            });
        }

        // Sincronizar Dados
        async function syncData() {
            if (!confirm('Deseja iniciar uma nova sincronização com a API do governo? Isso pode levar alguns minutos.')) return;

            document.getElementById('loading').style.display = 'block';
            
            try {
                const response = await fetch('/api/sync', { method: 'POST' });
                const result = await response.json();
                
                alert(`Sincronização concluída!\nNovos registros: ${result.new_records || 0}`);
                loadData(); // Recarrega dashboard
            } catch (error) {
                alert('Erro na sincronização: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
