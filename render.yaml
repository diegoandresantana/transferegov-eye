# Build Config
python: 3.11

# Install dependencies
install:
  - pip install -r requirements.txt

# Start command (override Procfile if needed)
start:
  - uvicorn server:app --host 0.0.0.0 --port $PORT

# Environment variables
env:
  - PYTHONUNBUFFERED=1
  - DATA_DIR=/tmp/data

# Health check
health_check:
  - curl -f http://localhost:$PORT/health || exit 1
